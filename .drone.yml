kind: pipeline
type: docker
name: default

trigger:
  event:
    - push
    - pull_request

clone:
  depth: 0

steps:
  - name: gitleaks
    image: zricethezav/gitleaks:latest
    commands:
      - gitleaks detect --source . -v

---
kind: pipeline
type: docker
name: renovate

trigger:
  event:
    - cron
  cron:
    - renovate

steps:
  - name: renovate
    image: renovate/renovate:44
    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_REPOSITORIES: cerfedino/Homelab
      RENOVATE_ONBOARDING: "false"
      RENOVATE_TOKEN:
        from_secret: renovate_github_token
      GITHUB_COM_TOKEN:
        from_secret: renovate_github_token
    commands:
      - 'curl -s -H "Authorization: token $RENOVATE_TOKEN" https://api.github.com/user | grep -E "login|message"'
      - 'curl -s -o /dev/null -w "pulls: %{http_code}\n" -H "Authorization: token $RENOVATE_TOKEN" https://api.github.com/repos/cerfedino/Homelab/pulls'
      - renovate
