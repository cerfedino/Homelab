kind: pipeline
type: docker
name: default

clone:
  depth: 0

steps:
  - name: gitleaks
    image: zricethezav/gitleaks:latest
    commands:
      - gitleaks detect --source . -v

---
kind: pipeline
type: docker
name: renovate

trigger:
  event:
    - cron
  cron:
    - renovate

steps:
  - name: renovate
    image: renovate/renovate:44
    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_REPOSITORIES: cerfedino/Homelab
      RENOVATE_ONBOARDING: "false"
      RENOVATE_TOKEN:
        from_secret: renovate_github_token
      GITHUB_COM_TOKEN:
        from_secret: renovate_github_token
    commands:
      - renovate
