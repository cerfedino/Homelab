apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-dynamic
  namespace: traefik
data:
  external-hosts.yaml: |
    http:
      serversTransports:
        insecure-backends:
          insecureSkipVerify: true

      middlewares:
        my-cloudflarewarp:
          plugin:
            cloudflarewarp:
              disableDefault: false
        https-redirect:
          redirectScheme:
            scheme: https
            permanent: true

      routers:
        # Catch-all on the plain-HTTP entrypoint: everything redirects to TLS
        http-catchall:
          rule: PathPrefix(`/`)
          entryPoints:
            - web
          priority: 1
          middlewares:
            - https-redirect
          service: noop@internal

        pve1:
          rule: Host(`pve1.{{ .Values.domain_lan }}`)
          entryPoints:
            - websecure
          service: pve1
        pbs1:
          rule: Host(`pbs1.{{ .Values.domain_lan }}`)
          entryPoints:
            - websecure
          service: pbs1
        pihole:
          rule: Host(`pihole.{{ .Values.domain_lan }}`)
          entryPoints:
            - websecure
          service: pihole

      services:
        pve1:
          loadBalancer:
            serversTransport: insecure-backends
            servers:
              - url: "https://pve1.proxmox-internal.{{ .Values.domain }}:8006"
        pbs1:
          loadBalancer:
            serversTransport: insecure-backends
            servers:
              - url: "https://sylvester-pbs1.proxmox-internal.{{ .Values.domain }}:8007"
        pihole:
          loadBalancer:
            serversTransport: insecure-backends
            servers:
              - url: "https://yosemite-dns.proxmox-internal.{{ .Values.domain }}"
