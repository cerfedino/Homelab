apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-dynamic
  namespace: traefik
data:
  external-hosts.yaml: |


    http:
      serversTransports:
        insecure-backends:
          insecureSkipVerify: true

      middlewares:
        my-cloudflarewarp:
          plugin:
            cloudflarewarp:
              disableDefault: false
        https-redirect:
          redirectScheme:
            scheme: https
            permanent: true

      routers:
        # Catch-all on the plain-HTTP entrypoint: everything redirects to TLS
        http-catchall:
          rule: PathPrefix(`/`)
          entryPoints:
            - web
          priority: 1
          middlewares:
            - https-redirect
          service: noop@internal
