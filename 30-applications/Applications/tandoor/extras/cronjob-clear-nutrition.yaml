# Tandoor MCP allows LLMs to override recipe-level nutrition info, so in a cron job we clear them every 5 minutes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clear-nutrition
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: psql
              image: postgres:18.6
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tandoor-postgres
                      key: password
              command:
                - psql
                - -h
                - tandoor-postgres
                - -U
                - tandoor
                - -d
                - tandoor
                - -v
                - ON_ERROR_STOP=1
                - -c
                - |
                  UPDATE cookbook_recipe SET nutrition_id = NULL WHERE nutrition_id IS NOT NULL;
                  DELETE FROM cookbook_nutritioninformation;
              resources:
                requests:
                  memory: 32Mi
                limits:
                  memory: 64Mi
