authentik:
  log_level: "info"

  # This sends anonymous usage-data, stack traces on errors and performance data to authentik.error-reporting.a7k.io, and is fully opt-in
  error_reporting:
    enabled: false

server:
  ingress:
    enabled: false

postgresql:
  enabled: true
  primary:
    podAnnotations:
      k8up.io/backupcommand: sh -c 'PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")" pg_dump --clean --if-exists -U "$POSTGRES_USER" "$POSTGRES_DB"'
      k8up.io/file-extension: .sql
