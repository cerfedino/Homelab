environments:
  default:
    values:
      - ../10-infra/generated/generated.infra.yaml
      - app-registry/generated/generated.apps-summary.yaml
      - app-registry/generated/generated.oidc.yaml
      - smtp.enc.yaml
---
repositories:
  - name: traefik
    url: https://traefik.github.io/charts
  - name: jetstack
    url: https://charts.jetstack.io
  - name: bedag
    url: https://bedag.github.io/helm-charts
  - name: authentik
    url: https://charts.goauthentik.io
  - name: immich
    url: https://immich-app.github.io/immich-charts
  - name: k8up-io
    url: https://k8up-io.github.io/k8up

releases:
  - name: csi-proxmox
    namespace: csi-proxmox
    createNamespace: true
    chart: oci://ghcr.io/sergelogvinov/charts/proxmox-csi-plugin
    version: "~0.5"
    wait: true
    values:
      - csi-proxmox/values.yaml.gotmpl

  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    version: "~1.21"
    wait: true
    values:
      - cert-manager/values.yaml.gotmpl
      - cert-manager/extras/extras.yaml.gotmpl

  - name: cert-manager-issuers
    namespace: cert-manager
    createNamespace: true
    chart: bedag/raw
    version: "~2.0"
    wait: true
    values:
      - cert-manager-issuers/extras/extras.yaml.gotmpl

  - name: traefik
    namespace: traefik
    createNamespace: true
    chart: traefik/traefik
    version: "~41.1"
    wait: true
    disableValidation: true
    values:
      - traefik/values.yaml.gotmpl
      - traefik/extras/extras.yaml.gotmpl

  - name: kuma
    namespace: kuma
    createNamespace: true
    chart: bedag/raw
    version: "~2.0"
    wait: true
    values:
      - kuma/extras/extras.yaml.gotmpl

    # BACKUPS
  - name: k8up-globals
    namespace: k8up
    createNamespace: true
    chart: bedag/raw
    version: "~2.0"
    wait: true
    values:
      - k8up/extras/extras.yaml.gotmpl

  - name: k8up
    namespace: k8up
    createNamespace: true
    chart: k8up-io/k8up
    version: "~4.10"
    wait: true
    values:
      - k8up/values.yaml

  - name: backrest
    namespace: backrest
    createNamespace: true
    chart: bedag/raw
    version: "~2.0"
    wait: true
    values:
      - backrest/extras/extras.yaml.gotmpl

  ####

  - name: pihole
    namespace: pihole
    createNamespace: true
    chart: bedag/raw
    version: "~2.0"
    wait: true
    values:
      - pihole/extras/extras.yaml.gotmpl

  - name: authentik
    namespace: authentik
    createNamespace: true
    chart: authentik/authentik
    version: "~2026.5"
    wait: true
    values:
      - authentik/values.yaml
      - authentik/values.enc.yaml
      - authentik/extras/extras.yaml.gotmpl

  - name: cloudflare-tunnel
    namespace: cloudflare-tunnel
    createNamespace: true
    chart: bedag/raw
    version: "~2.0"
    wait: true
    values:
      - cloudflare-tunnel/extras/extras.yaml.gotmpl

  - name: immich-extras
    namespace: immich
    createNamespace: true
    chart: bedag/raw
    version: "~2.0"
    wait: false
    values:
      - immich/extras/extras.yaml.gotmpl

  - name: immich
    namespace: immich
    createNamespace: true
    chart: immich/immich
    version: "~0.12"
    wait: true
    values:
      - immich/values.yaml.gotmpl

  - name: vaultwarden
    namespace: vaultwarden
    createNamespace: true
    chart: bedag/raw
    version: "~2.0"
    wait: true
    values:
      - vaultwarden/extras/extras.yaml.gotmpl

  - name: paperless
    namespace: paperless
    createNamespace: true
    chart: bedag/raw
    version: "~2.0"
    wait: true
    values:
      - paperless/extras/extras.yaml.gotmpl

  - name: syncthing
    namespace: syncthing
    createNamespace: true
    chart: bedag/raw
    version: "~2.0"
    wait: true
    values:
      - syncthing/extras/extras.yaml.gotmpl
