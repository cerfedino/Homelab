---
- name: Roll out the compose stacks
  hosts: proxy_vps
  become: true
  tasks:
    - name: Find the stacks, every folder next to this playbook holding a compose.yaml
      ansible.builtin.find:
        paths: "{{ playbook_dir }}"
        patterns: compose.yaml
        recurse: true
        depth: 2
      delegate_to: localhost
      become: false
      run_once: true
      register: _compose_files

    - name: Find the templates in the stacks, every file ending in .j2
      ansible.builtin.find:
        paths: "{{ playbook_dir }}"
        patterns: "*.j2"
        recurse: true
      delegate_to: localhost
      become: false
      run_once: true
      register: _template_files

    - name: Create the stacks directory
      ansible.builtin.file:
        path: /opt/stacks
        state: directory
        mode: "0700"

    - name: Copy the stacks
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/{{ item }}/"
        dest: "/opt/stacks/{{ item }}/"
      loop: "{{ _compose_files.files | map(attribute='path') | map('dirname') | map('basename') | sort }}"
      register: _copied

    - name: Render the templates next to their source, without the .j2
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "/opt/stacks/{{ item | relpath(playbook_dir) | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop: "{{ _template_files.files | map(attribute='path') | sort }}"
      loop_control:
        label: "{{ item | relpath(playbook_dir) }}"
      register: _rendered

    - name: Remember the stacks whose files changed
      ansible.builtin.set_fact:
        _changed_stacks: >-
          {{ (_copied.results | selectattr('changed') | map(attribute='item') | list)
             + (_rendered.results | selectattr('changed') | map(attribute='item')
                | map('relpath', playbook_dir) | map('split', '/') | map('first') | list) }}

    # compose only recreates on a changed service definition, not on a changed mounted file
    - name: Bring the stacks up
      community.docker.docker_compose_v2:
        project_src: "/opt/stacks/{{ item }}"
        remove_orphans: true
        recreate: "{{ 'always' if item in _changed_stacks else 'auto' }}"
      loop: "{{ _copied.results | map(attribute='item') | list }}"

# wg-portal owns these interfaces, so they can only be created once its stack is up
- name: Create the WireGuard networks wg-portal runs
  hosts: proxy_vps
  become: true
  vars_files:
    - wg-portal/secrets.enc.yaml
  vars:
    wg_portal_api: http://127.0.0.1:8888/api/v1
    wg_portal_api_user: admin@wgportal.local
    wg_portal_api_token: "{{ admin_api_token }}"
  tasks:
    - name: Set up each network
      ansible.builtin.include_tasks: ../../20-bootstrap/tasks/wireguard-portal.yaml
      loop: "{{ wireguard | dict2items | selectattr('value.portal') | selectattr('value.hub', 'eq', inventory_hostname) | list }}"
      loop_control:
        loop_var: network
        label: "{{ network.key }}"
