# must land on the node holding the media-data RWO attachment
defaultPodOptions:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: jellyfin
          topologyKey: kubernetes.io/hostname

controllers:
  radarr:
    strategy: Recreate
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/radarr
          tag: "6.3.0"
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Zurich
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 7878
              initialDelaySeconds: 30
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 7878
              initialDelaySeconds: 10
              periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
      seedbox-mount:
        image:
          repository: rclone/rclone
          tag: "1.75.0"
        command:
          - sh
          - -c
          - |
            mkdir -p /mnt/seedbox
            while umount -l /mnt/seedbox 2>/dev/null; do :; done
            exec rclone mount seedbox:downloads/qbittorrent/complete /mnt/seedbox --read-only --allow-other --dir-cache-time=30s
        env:
          RCLONE_CONFIG_SEEDBOX_TYPE: sftp
          RCLONE_CONFIG_SEEDBOX_HOST: aero.usbx.me
          RCLONE_CONFIG_SEEDBOX_USER: usb354
          RCLONE_CONFIG_SEEDBOX_PASS:
            valueFrom:
              secretKeyRef:
                name: seedbox-rclone
                key: pass_obscured
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 512Mi

service:
  app:
    controller: radarr
    ports:
      http:
        port: 7878

persistence:
  config:
    existingClaim: radarr-config
    advancedMounts:
      radarr:
        app:
          - path: /config
  media:
    existingClaim: media-data
    advancedMounts:
      radarr:
        app:
          - path: /media
  seedbox:
    type: emptyDir
    advancedMounts:
      radarr:
        app:
          - path: /mnt
            readOnly: true
            mountPropagation: HostToContainer
        seedbox-mount:
          - path: /mnt
            mountPropagation: Bidirectional
  fuse:
    type: hostPath
    hostPath: /dev/fuse
    advancedMounts:
      radarr:
        seedbox-mount:
          - path: /dev/fuse
