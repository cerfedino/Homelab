# must land on the node holding the media-data RWO attachment
defaultPodOptions:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: jellyfin
          topologyKey: kubernetes.io/hostname

controllers:
  radarr:
    strategy: Recreate
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/radarr
          tag: "6.3.0"
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Zurich
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 7878
              initialDelaySeconds: 30
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 7878
              initialDelaySeconds: 10
              periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: radarr
    ports:
      http:
        port: 7878

persistence:
  config:
    existingClaim: radarr-config
    advancedMounts:
      radarr:
        app:
          - path: /config
  media:
    existingClaim: media-data
    advancedMounts:
      radarr:
        app:
          - path: /media
