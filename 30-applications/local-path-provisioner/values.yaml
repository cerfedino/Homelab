storageClass:
  create: true
  name: local-path-ephemeral
  defaultClass: false
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer

nodePathMap:
  - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
    paths:
      - /opt/local-path-provisioner

resources:
  requests:
    memory: 32Mi
  limits:
    memory: 64Mi
