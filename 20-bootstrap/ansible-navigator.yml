---
ansible-navigator:
  ansible:
    inventory:
      entries:
        - inventory.yaml
    config:
      path: ansible.cfg
  execution-environment:
    enabled: true
    volume-mounts:
      - src: "${PWD}/../10-infra/keys"
        dest: "${PWD}/../10-infra/keys"
        options: "ro"
      - src: "${PWD}/../.sops"
        dest: "${PWD}/../.sops"
        options: "ro"
    environment-variables:
      pass:
        - SOPS_AGE_KEY_FILE
    container-options:
      - "--userns=keep-id"
      # --ipc=host: keep-id + host IPC can't mount /dev/mqueue
      - "--ipc=private"
    image: ansible_ee:latest
    pull:
      policy: missing
  mode: stdout
  enable-prompts: true
