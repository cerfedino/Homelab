---
- name: Join the WireGuard backbone
  hosts: backbone
  become: true
  tasks:
    - name: Install the WireGuard tools
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Generate the private key
      ansible.builtin.shell:
        cmd: umask 077 && wg genkey > /etc/wireguard/backbone.key
        creates: /etc/wireguard/backbone.key
      register: _backbone_key

    - name: Read the public key
      ansible.builtin.shell:
        cmd: wg pubkey < /etc/wireguard/backbone.key
      register: _backbone_public_key
      changed_when: false
      check_mode: false

    - name: Write the interface config
      ansible.builtin.template:
        src: templates/wireguard/backbone.conf.j2
        dest: /etc/wireguard/backbone.conf
        owner: root
        group: root
        mode: "0600"
      register: _backbone_conf

    - name: Bring the hub up, now and at boot
      ansible.builtin.systemd_service:
        name: wg-quick@backbone
        enabled: true
        state: "{{ 'restarted' if _backbone_key.changed or _backbone_conf.changed else 'started' }}"
      when: inventory_hostname == wireguard_backbone.hub
      register: _backbone_hub

    - name: Bring the peers up, now and at boot
      ansible.builtin.systemd_service:
        name: wg-quick@backbone
        enabled: true
        state: "{{ 'restarted' if _backbone_key.changed or _backbone_conf.changed or hostvars[wireguard_backbone.hub]._backbone_hub.changed else 'started' }}"
      when: inventory_hostname != wireguard_backbone.hub
