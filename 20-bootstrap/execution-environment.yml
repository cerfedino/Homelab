version: 3

images:
  base_image:
    name: registry.fedoraproject.org/fedora:45

additional_build_steps:
  prepend_galaxy:
    - RUN dnf install -y git

dependencies:
  python_interpreter:
    package_system: python3
  ansible_core:
    package_pip: ansible-core

  ansible_runner:
    package_pip: ansible-runner
  system:
    - openssh-clients
    - sshpass
  galaxy:
    collections:
      - name: artis3n.tailscale
      - name: https://github.com/k3s-io/k3s-ansible.git
        type: git
        version: de30fcd
