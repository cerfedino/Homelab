# Make a k3s server leave the cluster.
#
# ansible-navigator run playbook-evict-node.yaml -e node=<host>
#
# The cluster record is deleted through a survivor.

- name: Validate input
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Refuse bad input
      ansible.builtin.assert:
        that:
          - node is defined
          - node in groups['server']
        fail_msg: "node must name a host in the server group"

- name: Evict the node from the cluster
  hosts: "{{ node }}"
  gather_facts: false
  become: false
  tasks:
    - name: Set helper_node
      ansible.builtin.set_fact:
        helper_node: "{{ groups['server'] | difference([node]) | first }}"

    - name: Show the plan
      ansible.builtin.debug:
        msg: "evicting {{ node }}, cluster operations via {{ helper_node }}"

    - name: Drain the node in case its still alive
      ansible.builtin.command: >-
        k3s kubectl drain {{ node }}
        --ignore-daemonsets --delete-emptydir-data --force --timeout=90s
      delegate_to: "{{ helper_node }}"
      become: true
      failed_when: false
      changed_when: false

    # We need to wait for the CSI Proxmox plugin to detach the disks from the old node before deleting it from etcd, otherwise the disks risk to be attached to multiple nodes.
    - name: Wait for the volumes to detach before the Node record disappears
      ansible.builtin.command: >-
        k3s kubectl get volumeattachments
        -o jsonpath='{.items[?(@.spec.nodeName=="{{ node }}")].metadata.name}'
      delegate_to: "{{ helper_node }}"
      become: true
      register: attachments
      until: attachments.stdout | trim == ""
      retries: 36
      delay: 5
      failed_when: false
      changed_when: false

    - name: Warn about volumes that never detached
      ansible.builtin.debug:
        msg: >-
          {{ node }} still has VolumeAttachments ({{ attachments.stdout }}).
          Deleting the Node now leaves their disks attached to the old VM;
          detach them in Proxmox by hand.
      when: attachments.stdout | trim != ""

    - name: Remove the node from the cluster
      ansible.builtin.command: k3s kubectl delete node {{ node }} --ignore-not-found
      delegate_to: "{{ helper_node }}"
      become: true
