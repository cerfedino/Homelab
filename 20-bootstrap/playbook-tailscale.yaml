- name: Setup tailscale
  hosts: tailscale_gw
  pre_tasks:
    - name: Enable IP forwarding
      become: true
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-tailscale.conf
        content: |
          net.ipv4.ip_forward = 1
          net.ipv6.conf.all.forwarding = 1
    - name: Apply sysctls
      become: true
      ansible.builtin.command: sysctl --system
      changed_when: false
  roles:
    - role: artis3n.tailscale.machine
      vars:
        tailscale_authkey: "{{ tailscale_key }}"
        tailscale_args: "--reset --advertise-routes={{ network_lan.cidr }} --accept-dns=false --advertise-exit-node"
