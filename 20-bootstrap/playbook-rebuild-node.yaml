# Rebuild a dead or sick k3s server.
#
# ansible-navigator run playbook-rebuild-node.yaml -e node=<host>

- name: Evict the node
  ansible.builtin.import_playbook: playbook-evict-node.yaml

# Wipe k3s on the node in case its already present
- name: Wipe stale k3s state on the rebuilt node
  hosts: "{{ node }}"
  gather_facts: false
  become: true
  tasks:
    - name: Check for an existing k3s install
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Stop k3s and wipe stale etcd state
      when: k3s_bin.stat.exists
      block:
        - name: Stop k3s
          ansible.builtin.systemd_service:
            name: k3s
            state: stopped
        - name: Remove stale etcd db
          ansible.builtin.file:
            path: /var/lib/rancher/k3s/server/db
            state: absent

- name: OS prep
  ansible.builtin.import_playbook: playbook-disable-ra-dns.yaml

- name: Kube-vip manifests
  ansible.builtin.import_playbook: playbook-kube-vip.yaml

- name: Join via the creation playbook
  ansible.builtin.import_playbook: playbook-k3s.yaml

- name: Verify the node rejoined
  hosts: "{{ node }}"
  gather_facts: false
  become: true
  tasks:
    - name: Wait for the node to join Ready
      ansible.builtin.command: >-
        k3s kubectl wait --for=condition=Ready node/{{ node }} --timeout=15s
      delegate_to: "{{ hostvars[node]['helper_node'] }}"
      register: wait_ready
      until: wait_ready.rc == 0
      retries: 24
      delay: 5
      changed_when: false
