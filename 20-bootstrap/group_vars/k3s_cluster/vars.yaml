k3s_version: v1.36.3+k3s1

# Both kube-vip instances are hostNetwork on every node, so their metrics listeners must never share a port. cp binds this, svc binds this+1
kube_vip_metrics_port: 2112

# Lease timings tolerant to IO-delay spikes
kube_vip_lease_duration: 30
kube_vip_renew_deadline: 20
kube_vip_retry_period: 4

# Only used to FORM/JOIN the cluster (joining servers reach the init server here).
# kubectl uses the kube-vip VIP instead.
api_endpoint: "{{ hostvars[groups['server'][0]]['ip_internal'] }}"

server_config_yaml: |
  tls-san: {{ ([kube_vip_cp_address] + k3s_server_lan_ips) | to_json }}
  node-ip: "{{ ip_internal }}"        # pin etcd/kubelet to the stable internal net

  # We actually use Cilium
  flannel-backend: none
  disable-network-policy: true
  resolv-conf: /etc/rancher/k3s/resolv.conf
  kubelet-arg:
    - provider-id=proxmox://{{ proxmox_cluster_name }}/{{ vm_id }}
  node-label:
    - topology.kubernetes.io/region={{ proxmox_cluster_name }}
    - topology.kubernetes.io/zone={{ proxmox_node_name }}
  disable:
    - traefik
    - servicelb # kube-vip owns LoadBalancer services
    - local-storage # csi-proxmox will be the default pvc
  {% if node is defined and inventory_hostname == node %}
  {# rebuild: this node is supposed to REJOIN the cluster through the IP of a survivor #}
  cluster-init: false
  server: https://{{ hostvars[groups['server'] | difference([node]) | first]['ip_internal'] }}:6443
  {% endif %}

