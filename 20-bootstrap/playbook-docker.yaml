---
- name: Install Docker and the compose plugin
  hosts: proxy_vps
  become: true
  tasks:
    - name: Install what the apt repository module needs
      ansible.builtin.apt:
        name: python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add the Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
        suites: "{{ ansible_facts.distribution_release }}"
        components: stable
        signed_by: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"

    - name: Install the pinned versions
      ansible.builtin.apt:
        name:
          - "docker-ce=5:{{ docker_version }}-*"
          - "docker-ce-cli=5:{{ docker_version }}-*"
          - "docker-compose-plugin={{ docker_compose_version }}-*"
        state: present
        update_cache: true
        allow_change_held_packages: true

    - name: Hold them so apt upgrade leaves the pins alone
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - docker-ce
        - docker-ce-cli
        - docker-compose-plugin
