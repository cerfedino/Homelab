---
# Get current leader: $ kubectl -n kube-system get lease plndr-cp-lock -o jsonpath='{.spec.holderIdentity}{"\n"}'
- name: Deploy kube-vip for Control Plan and Service
  hosts: server
  become: true
  run_once: true
  tasks:
    - name: Detect the LAN interface (the one carrying the default route)
      ansible.builtin.set_fact:
        kube_vip_cp_interface: "{{ ansible_default_ipv4.interface }}"
        kube_vip_svc_interface: "{{ ansible_default_ipv4.interface }}"

    - name: Show what we resolved (sanity check)
      ansible.builtin.debug:
        msg: "CP VIP {{ kube_vip_cp_address }} will be announced on interface {{ kube_vip_cp_interface }}"

    - name: Ensure the k3s auto-deploy manifests directory exists
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/manifests
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Render kube-vip manifests into the k3s auto-deploy directory
      ansible.builtin.template:
        src: "templates/kube-vip/{{ item }}"
        dest: "/var/lib/rancher/k3s/server/manifests/{{ item | regex_replace('\\.j2$', '') }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - kube-vip-common.yaml
        - kube-vip-cp.yaml.j2
        - kube-vip-svc.yaml.j2
