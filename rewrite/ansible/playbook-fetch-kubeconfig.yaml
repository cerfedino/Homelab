---
- name: Fetch kubeconfig to the control machine
  hosts: server
  gather_facts: false
  run_once: true # each host has a copy of the config, just fetch first one
  become: true # /etc/rancher/k3s/k3s.yaml is root-only
  tasks:
    - name: Read k3s kubeconfig from a server node
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: _k3s_kubeconfig

    - name: Write kubeconfig locally, pointed at the cluster endpoint
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/kubeconfig.yaml"
        mode: "0600"
        content: >-
          {{ _k3s_kubeconfig.content | b64decode
             | replace('https://127.0.0.1:6443',
                       'https://' ~ kube_vip_address ~ ':' ~ (api_port | default(6443))) }}
      delegate_to: localhost
      become: false
